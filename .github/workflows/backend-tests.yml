# Runs the full backend suite, including every PostgreSQL test, on each PR and push to main.
# The database is a disposable local PostgreSQL on the runner, never a real database.
name: backend-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VIP_TEST_DB_URL: postgresql+psycopg2://vip_app@127.0.0.1:5432/vip_v0001_test
    steps:
      - uses: actions/checkout@v4

      # Runner-local PostgreSQL: conftest requires the server to report 127.0.0.1,
      # which a Docker service container would not.
      - name: Start disposable PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE vip_app LOGIN SUPERUSER" -c "CREATE DATABASE vip_v0001_test OWNER vip_app"
          PGCONF=$(sudo -u postgres psql -tAc "SHOW hba_file")
          echo "host all vip_app 127.0.0.1/32 trust" | sudo tee "$PGCONF.new" >/dev/null
          sudo cat "$PGCONF" | sudo tee -a "$PGCONF.new" >/dev/null
          sudo mv "$PGCONF.new" "$PGCONF"
          sudo systemctl reload postgresql.service

      - name: libpq headers (psycopg2 builds from source)
        run: sudo apt-get install -y --no-install-recommends libpq-dev

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install backend
        working-directory: backend
        run: uv sync --frozen

      - name: Migrate a fresh database
        working-directory: backend
        env:
          VIP_DB_URL: ${{ env.VIP_TEST_DB_URL }}
        run: uv run alembic upgrade head

      - name: Run all backend tests
        working-directory: backend
        run: uv run pytest -q

  frontend-build:
    # The UI bundle in backend/static is served by FastAPI; it must match frontend/src.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Committed bundle matches source
        run: git diff --exit-code -- backend/static

  docker-image:
    # The deployment image must build, and the compose file must parse. Nothing is pushed.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vip-app:ci .
      - name: Image runs as non-root and imports the app
        run: |
          test "$(docker run --rm vip-app:ci id -u)" = "10001"
          docker run --rm -e VIP_DB_URL=postgresql+psycopg2://x:y@127.0.0.1:1/x vip-app:ci python -c "import app.main, app.scheduler, app.admin_cli, psycopg2; print('ok')"
      - name: Compose file is valid
        working-directory: deploy
        run: |
          printf 'VIP_DOMAIN=ci.example.com\nPOSTGRES_PASSWORD=x\nVIP_DB_PASSWORD=y\n' > .env
          mkdir -p secrets && cp secrets-example/app.env secrets/app.env
          docker compose config -q
